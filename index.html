    <script>
      (function () {
        let hasHandledFirstInteract = false;
        let capturedThirdPartyId = null;

        function findThirdPartyId(node) {
          if (!node || typeof node !== "object") {
            return null;
          }

          if (
            node.user &&
            typeof node.user === "object" &&
            typeof node.user.thirdPartyId === "string"
          ) {
            return node.user.thirdPartyId;
          }

          if (typeof node.thirdPartyId === "string") {
            return node.thirdPartyId;
          }

          if (Array.isArray(node)) {
            for (const item of node) {
              const found = findThirdPartyId(item);
              if (found) {
                return found;
              }
            }
            return null;
          }

          for (const value of Object.values(node)) {
            const found = findThirdPartyId(value);
            if (found) {
              return found;
            }
          }

          return null;
        }

        function extractThirdPartyIdFromInteractResponse(responseBody) {
          if (!responseBody || typeof responseBody !== "object") {
            return null;
          }

          const decisionHandles = Array.isArray(responseBody.handle)
            ? responseBody.handle.filter(
                (handle) =>
                  typeof handle?.type === "string" &&
                  handle.type.indexOf("personalization:decisions") !== -1,
              )
            : [];

          for (const handle of decisionHandles) {
            const found = findThirdPartyId(handle.payload);
            if (found) {
              return found;
            }
          }

          return null;
        }

        function updateCategoriesHeading(thirdPartyId) {
          if (!thirdPartyId) {
            return;
          }

          capturedThirdPartyId = thirdPartyId;
          const categoriesTitle = document.getElementById("categories-title");

          if (categoriesTitle) {
            categoriesTitle.textContent =
              "Categories - Your Hashed ID Is: " + thirdPartyId;
          }
        }

        document.addEventListener("DOMContentLoaded", function () {
          if (capturedThirdPartyId) {
            updateCategoriesHeading(capturedThirdPartyId);
          }
        });

        const originalFetch = window.fetch;
        if (typeof originalFetch !== "function") {
          return;
        }

        window.fetch = function patchedFetch(...args) {
          const request = args[0];
          const requestUrl =
            typeof request === "string"
              ? request
              : typeof request?.url === "string"
                ? request.url
                : "";

          return originalFetch.apply(this, args).then((response) => {
            const isInteractRequest = /\/interact(?:\?|$)/.test(requestUrl);

            if (!hasHandledFirstInteract && isInteractRequest) {
              hasHandledFirstInteract = true;
              response
                .clone()
                .json()
                .then((responseBody) => {
                  const thirdPartyId =
                    extractThirdPartyIdFromInteractResponse(responseBody);
                  if (thirdPartyId) {
                    updateCategoriesHeading(thirdPartyId);
                  }
                })
                .catch(() => {});
            }

            return response;
          });
        };
      })();
    </script>

        const icon = icons[productId] || icons.novel;
        const svgContent = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-${productId}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:${colors.primary};stop-opacity:0.3" />
                        <stop offset="100%" style="stop-color:${colors.accent};stop-opacity:0.1" />
                    </linearGradient>
                </defs>
                <rect width="100" height="100" fill="url(#grad-${productId})" rx="12"/>
                <g color="${colors.primary}" stroke-linecap="round" stroke-linejoin="round">
                    ${icon}
                </g>
            </svg>`;

        return "data:image/svg+xml;base64," + btoa(svgContent);
      }

      function setCategoriesTitleWithHashedId(thirdPartyId) {
        const categoriesTitle = document.getElementById("categories-title");
        if (!categoriesTitle || !thirdPartyId) {
          return;
        }

        categoriesTitle.textContent =
          "Categories - Your Hashed ID Is: " + thirdPartyId;
      }

      function findThirdPartyId(value) {
        if (!value || typeof value !== "object") {
          return null;
        }

        if (
          typeof value.thirdPartyId === "string" &&
          value.thirdPartyId.trim()
        ) {
          return value.thirdPartyId;
        }

        if (
          value.user &&
          typeof value.user === "object" &&
          typeof value.user.thirdPartyId === "string" &&
          value.user.thirdPartyId.trim()
        ) {
          return value.user.thirdPartyId;
        }

        if (Array.isArray(value)) {
          for (const entry of value) {
            const foundInArray = findThirdPartyId(entry);
            if (foundInArray) {
              return foundInArray;
            }
          }
          return null;
        }

        for (const childValue of Object.values(value)) {
          const foundInObject = findThirdPartyId(childValue);
          if (foundInObject) {
            return foundInObject;
          }
        }

        return null;
      }

      function extractThirdPartyIdFromInteractResponse(response) {
        if (!response) {
          return null;
        }

        // Common Web SDK response shapes can vary by configuration.
        const directPaths = [
          response.user,
          response.personalization,
          response.propositions,
          response.decisions,
        ];

        for (const candidate of directPaths) {
          const found = findThirdPartyId(candidate);
          if (found) {
            return found;
          }
        }

        return findThirdPartyId(response);
      }

      function setupAlloyFirstInteractListener() {
        let firstSendEventHandled = false;

        function wrapAlloy(alloyFn) {
          if (
            typeof alloyFn !== "function" ||
            alloyFn.__wrappedForThirdPartyIdLookup
          ) {
            return alloyFn;
          }

          const wrappedAlloy = function (...args) {
            const command = args[0];
            const result = alloyFn.apply(this, args);

            if (
              !firstSendEventHandled &&
              command === "sendEvent" &&
              result &&
              typeof result.then === "function"
            ) {
              firstSendEventHandled = true;
              result
                .then((response) => {
                  const thirdPartyId =
                    extractThirdPartyIdFromInteractResponse(response);
                  if (thirdPartyId) {
                    setCategoriesTitleWithHashedId(thirdPartyId);
                    console.log("Resolved user.thirdPartyId:", thirdPartyId);
                  } else {
                    console.log(
                      "First sendEvent completed, but user.thirdPartyId was not found in decisions.",
                    );
                  }
                })
                .catch((error) => {
                  console.warn("First sendEvent failed:", error);
                });
            }

            return result;
          };

          wrappedAlloy.__wrappedForThirdPartyIdLookup = true;
          return wrappedAlloy;
        }

        if (typeof window.alloy === "function") {
          window.alloy = wrapAlloy(window.alloy);
          return;
        }

        const existingAlloyDescriptor = Object.getOwnPropertyDescriptor(
          window,
          "alloy",
        );

        if (existingAlloyDescriptor && !existingAlloyDescriptor.configurable) {
          const maxAttempts = 150;
          let attempts = 0;
          const intervalId = setInterval(() => {
            attempts += 1;
            if (typeof window.alloy === "function") {
              window.alloy = wrapAlloy(window.alloy);
              clearInterval(intervalId);
              return;
            }

            if (attempts >= maxAttempts) {
              clearInterval(intervalId);
            }
          }, 100);
          return;
        }

        let alloyValue = window.alloy;
        Object.defineProperty(window, "alloy", {
          configurable: true,
          enumerable: true,
          get() {
            return alloyValue;
          },
          set(value) {
            alloyValue = wrapAlloy(value);
          },
        });

        if (typeof alloyValue === "function") {
          alloyValue = wrapAlloy(alloyValue);
        }
      }

      function assignProductImages() {
        Object.entries(categories).forEach(([categoryKey, category]) => {
          category.products.forEach((product) => {
            product.image = createProductImage(
              product.name,
              categoryKey,
              product.id,
            );
          });
        });
      }

      function initializeCategories() {
        const categoriesDiv = document.getElementById("categories");
        categoriesDiv.innerHTML = "";
        Object.entries(categories).forEach(([key, category]) => {
          const btn = document.createElement("button");
          btn.className = "category-btn";
          btn.textContent = category.name;
          btn.onclick = () => selectCategory(key);
          categoriesDiv.appendChild(btn);
        });
      }

      function selectCategory(categoryKey) {
        currentCategory = categoryKey;
        const category = categories[categoryKey];
        const productsDiv = document.getElementById("products");
        productsDiv.innerHTML = "";
        console.log(`selected category: ${category.name}`);

        category.products.forEach((product) => {
          const productDiv = document.createElement("div");
          productDiv.className = "product-item";

          const nameSpan = document.createElement("span");
          nameSpan.className = "product-name";
          nameSpan.textContent = product.name;

          const imageEl = document.createElement("img");
          imageEl.className = "product-image";
          imageEl.src = product.image;
          imageEl.alt = `${product.name} product image`;

          const priceSpan = document.createElement("span");
          priceSpan.className = "product-price";
          priceSpan.textContent = formatCurrency(product.price);

          const actionsDiv = document.createElement("div");
          actionsDiv.className = "product-actions";

          const viewBtn = document.createElement("button");
          viewBtn.className = "view-btn";
          viewBtn.textContent = "View Product";
          viewBtn.onclick = () => openProductView(product, categoryKey);
          actionsDiv.appendChild(viewBtn);

          productDiv.appendChild(nameSpan);
          productDiv.appendChild(imageEl);
          productDiv.appendChild(priceSpan);
          productDiv.appendChild(actionsDiv);
          productsDiv.appendChild(productDiv);
        });
      }

      function openProductView(product, categoryKey) {
        currentProduct = product;
        const categoryName = categories[categoryKey]?.name || "Unknown";
        renderProductView(product, categoryName);
        trackProductView(product, categoryName);
      }

      function renderProductView(product, categoryName) {
        const pdpDiv = document.getElementById("pdp");
        pdpDiv.className = "";
        pdpDiv.innerHTML = "";

        const card = document.createElement("div");
        card.className = "pdp-card";

        const imageEl = document.createElement("img");
        imageEl.className = "pdp-image";
        imageEl.src = product.image;
        imageEl.alt = `${product.name} product image`;

        const metaDiv = document.createElement("div");
        metaDiv.className = "pdp-meta";

        const nameEl = document.createElement("div");
        nameEl.className = "pdp-name";
        nameEl.textContent = product.name;

        const categoryEl = document.createElement("div");
        categoryEl.className = "pdp-category";
        categoryEl.textContent = `Category: ${categoryName}`;

        const descriptionEl = document.createElement("div");
        descriptionEl.className = "pdp-description";
        descriptionEl.textContent = product.description;

        const priceEl = document.createElement("div");
        priceEl.className = "pdp-price";
        priceEl.textContent = formatCurrency(product.price);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "product-actions";

        const addBtn = document.createElement("button");
        addBtn.className = "add-btn";
        addBtn.textContent = "Add to Cart";
        addBtn.onclick = () => addToCart(product);

        actionsDiv.appendChild(addBtn);

        metaDiv.appendChild(nameEl);
        metaDiv.appendChild(categoryEl);
        metaDiv.appendChild(descriptionEl);
        metaDiv.appendChild(priceEl);
        metaDiv.appendChild(actionsDiv);

        card.appendChild(imageEl);
        card.appendChild(metaDiv);
        pdpDiv.appendChild(card);
      }

      function trackProductView(product, categoryName) {
        const inventory =
          product.inventory || (hashString(product.id) % 40) + 10;
        const targetData = {
          "entity.id": product.sku,
          "entity.name": product.name,
          "entity.category": categoryName,
          "entity.pageUrl": window.location.href,
          "entity.thumbnailUrl": "https://http.cat/200.jpg",
          "entity.message": `Viewed PDP for ${product.name}`,
          "entity.value": product.price,
          "entity.inventory": inventory,
        };

        if (product.as4001) {
          targetData["entity.as4001"] = product.as4001;
        }

        alloy("sendEvent", {
          personalization: {
            decisionScopes: ["demo-pdp-view"],
          },
          data: {
            __adobe: {
              target: targetData,
            },
          },
        });

        console.log("PDP view event sent:", product.name);
      }

      function addToCart(product) {
        cart.push(product);
        console.log(`added ${product.name} to cart`);
        updateCartDisplay();
      }

      function removeFromCart(productId) {
        const index = cart.findIndex((item) => item.id === productId);
        if (index > -1) {
          const removedItem = cart[index];
          cart.splice(index, 1);
          console.log(`removed ${removedItem.name} from cart`);
          updateCartDisplay();
        }
      }

      function updateCartDisplay() {
        const cartDiv = document.getElementById("cart");
        const cartTotalDiv = document.getElementById("cart-total");
        const cartTotal = calculateCartTotal();

        if (cart.length === 0) {
          cartDiv.innerHTML =
            '<div class="empty-cart">Your cart is empty</div>';
          cartTotalDiv.textContent = `Total: ${formatCurrency(cartTotal)}`;
          return;
        }

        cartDiv.innerHTML = "";
        cart.forEach((item) => {
          const cartItem = document.createElement("div");
          cartItem.className = "cart-item";
          cartItem.innerHTML = `
                    <span>${item.name} • ${formatCurrency(item.price)}</span>
                    <button class="remove-btn" onclick="removeFromCart('${item.id}')">Remove</button>
                `;
          cartDiv.appendChild(cartItem);
        });

        cartTotalDiv.textContent = `Total: ${formatCurrency(cartTotal)}`;
      }

      function checkout() {
        const itemNames = cart
          .map((item) => `${item.name} (${item.sku})`)
          .join(", ");
        const cartTotal = calculateCartTotal();
        console.log(
          `checked out with: ${itemNames || "empty cart"} | cart total: ${formatCurrency(cartTotal)}`,
        );
        cart = [];
        updateCartDisplay();
      }

      window.addEventListener("DOMContentLoaded", () => {
        setupAlloyFirstInteractListener();
        assignProductImages();
        initializeCategories();
        updateCartDisplay();

        const firstCategoryKey = Object.keys(categories)[0];
        if (firstCategoryKey) {
          selectCategory(firstCategoryKey);
        }
      });
    </script>
  </body>
</html>
